<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>London Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"
    integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ=="
    crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"
    integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ=="
    crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Add proper spacing and styling for popups */
        .leaflet-popup-content-wrapper {
            max-width: 250px; /* Adjust width as needed */
            word-wrap: break-word;
        }
        .popup-content {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .popup-content.show-more {
            max-height: 100px; /* Adjust height for initial view */
            overflow: hidden;
        }
        .popup-content.show-more.expanded {
            max-height: none;
        }
        .toggle-more {
            color: blue;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="map" style="height: 600px;"></div>
    <button id="toggleTrainStops">Toggle Train Stops</button>
    <script type="text/javascript">
        // Initialize the map
        const map = L.map('map').setView([51.505, -0.09], 13);

        // Base map layers
        const basemaps = {
            StreetView: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }),
            Places: L.tileLayer.wms('http://ows.mundialis.de/services/service?', {
                layers: 'OSM-Overlay-WMS'
            })
        };
        L.control.layers(basemaps).addTo(map);
        basemaps.StreetView.addTo(map);

        // Landmarks
        const landmarks = [
            {
                name: "Tower Bridge",
                lat: 51.505554,
                lon: -0.075278,
                iconUrl: 'tower-bridge.png',
                popupContent: '<b>Tower Bridge</b><br />"Tower Bridge is a Grade I listed combined bascule and suspension bridge in London, built between 1886 and 1894, designed by Horace Jones and engineered by John Wolfe Barry with the help of Henry Marc Brunel. It crosses the River Thames close to the Tower of London and is one of five London bridges owned and maintained by the Bridge House Estates, a charitable trust founded in 1282. The bridge was constructed to give better access to the East End of London, which had expanded its commercial potential in the 19th century." - Wikipedia'
            },
            // Other landmarks here...
        ];

        // Add landmark markers to the map
        landmarks.forEach(landmark => {
            const landmarkIcon = L.icon({
                iconUrl: landmark.iconUrl,
                iconSize: [50, 50],
                attribution: `<a href="https://www.flaticon.com/free-icons/${landmark.name.toLowerCase()}" title="${landmark.name.toLowerCase()} icons">${landmark.name} icons created by Flaticon</a>`
            });

            // Function to format popup content with "Show More" toggle
            const formatPopupContent = (content) => {
                const maxLength = 200; // Maximum length before "Show More" toggle
                if (content.length <= maxLength) return content;

                const shortContent = content.slice(0, maxLength) + '...';
                return `<div class="popup-content show-more" data-full-content="${content}">${shortContent}</div><a class="toggle-more" href="#">Show More</a>`;
            };

            const popupContent = formatPopupContent(landmark.popupContent);

            L.marker([landmark.lat, landmark.lon], { icon: landmarkIcon })
                .bindPopup(popupContent)
                .addTo(map);
        });

        // Event delegation to handle "Show More" toggle click
        document.addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('toggle-more')) {
                e.preventDefault();
                const popupContent = e.target.previousElementSibling;
                if (popupContent.classList.contains('expanded')) {
                    popupContent.classList.remove('expanded');
                    e.target.textContent = 'Show More';
                } else {
                    popupContent.classList.add('expanded');
                    e.target.textContent = 'Show Less';
                }
            }
        });

        // Set to track already added stations (by coordinates)
        const addedStations = new Set();

        // Train station icon
        const trainIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/4540/4540243.png',
            iconSize: [30, 30],
            attribution: '<a href="https://www.flaticon.com/free-icons/train" title="train icons">Train icons created by Freepik - Flaticon</a>'
        });

        // Layer group for train stops with marker clustering
        const trainStopsLayer = L.markerClusterGroup();

        // Function to add train stops within boundary
        function fetchTrainStops() {
            const overpassUrl = 'https://overpass-api.de/api/interpreter?data=[out:json];node["railway"="station"](51.48,-0.14,51.52,-0.09);out;';
            
            fetch(overpassUrl)
                .then(response => response.json())
                .then(data => {
                    data.elements.forEach(station => {
                        const latLng = `${station.lat},${station.lon}`;
                        const stationName = station.tags.name || 'Unknown Station';

                        // Check if the station was already added (based on coordinates)
                        if (!addedStations.has(latLng)) {
                            // Add station to the train layer (with clustering)
                            L.marker([station.lat, station.lon], { icon: trainIcon })
                                .bindPopup(`<b>${stationName}</b>`)
                                .addTo(trainStopsLayer);

                            // Add this station to the set to avoid duplicates
                            addedStations.add(latLng);
                        }
                    });
                    trainStopsLayer.addTo(map); // Add train stops to map initially
                })
                .catch(err => console.error(err));
        }

        // Call the function to fetch and add train stops within limited boundary
        fetchTrainStops();

        // Add the ability to toggle train stops visibility
        let trainStopsVisible = true;
        document.getElementById('toggleTrainStops').addEventListener('click', function() {
            if (trainStopsVisible) {
                map.removeLayer(trainStopsLayer);
            } else {
                map.addLayer(trainStopsLayer);
            }
            trainStopsVisible = !trainStopsVisible;
        });

        // A popup welcoming the user
        var popup = L.popup({ offset: L.point(20, 30) })
            .setLatLng([51.526490, -0.107875])
            .setContent("<b>Welcome to London Map 💂🎡🌉</b><br />Click on the markers to learn more about each attraction, and the nearby stations.")
            .openOn(map);
    </script>
</body>
</html>
